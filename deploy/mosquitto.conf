# Broker host template: install files root-owned with broker-readable permissions.
listener 8883
allow_anonymous false
password_file /etc/mosquitto/bosch-passwords
acl_file /etc/mosquitto/bosch.acl
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/broker.crt
keyfile /etc/mosquitto/certs/broker.key
tls_version tlsv1.2
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60
log_dest syslog
