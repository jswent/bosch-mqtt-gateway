name: bosch-mqtt-dev
services:
  mqtt:
    image: eclipse-mosquitto:2.0.22@sha256:199ea8ef2e35ec2b1b37e59cfd1dbae538ed4dfa4a2251a121a52215a6248a21
    user: '10001:10001'
    volumes:
      - ./dev/generated/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./dev/generated/ca.crt:/run/secrets/ca.crt:ro
      - ./dev/generated/mqtt.crt:/run/secrets/mqtt.crt:ro
      - ./dev/generated/mqtt.key:/run/secrets/mqtt.key:ro
      - ./dev/generated/passwords:/run/secrets/passwords:ro
      - ./dev/generated/acl:/run/secrets/acl:ro
    ports: ['127.0.0.1:18883:8883']
    networks: [lab]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  simulator:
    build: {context: ., dockerfile: dev/Dockerfile.simulator}
    volumes:
      - ./dev/generated/simulator.crt:/run/secrets/simulator.crt:ro
      - ./dev/generated/simulator.key:/run/secrets/simulator.key:ro
      - ./dev/generated/panel_code:/run/secrets/panel_code:ro
    ports: ['127.0.0.1:17700:7700', '127.0.0.1:18081:8081']
    networks: [lab]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  gateway:
    build: .
    depends_on: [mqtt, simulator]
    volumes:
      - ./dev/generated/ca.crt:/run/secrets/ca.crt:ro
      - ./dev/generated/panel_code:/run/secrets/panel_code:ro
      - ./dev/generated/mqtt_gateway_password:/run/secrets/mqtt_gateway_password:ro
      - ./dev/generated/debug_token:/run/secrets/debug_token:ro
      - gateway-state:/var/lib/bosch-mqtt-gateway
      - ./dev/generated/gateway.toml:/etc/bosch-mqtt-gateway/config.toml:ro
    ports: ['127.0.0.1:18080:8080']
    networks: [lab]
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2@sha256:33afb0659d786213264c2211f8d91c5fe87461c56eba6a3a546eb05fc71e89f4
    volumes:
      - ha-config:/config
      - ./dev/generated/ca.crt:/config/broker-ca.crt:ro
    ports: ['127.0.0.1:18123:8123']
    networks: [lab]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
volumes:
  ha-config:
  gateway-state:
networks:
  lab:
    driver: bridge
